name: 同步上游并发布镜像

on:
  schedule:
    - cron: "27 3 * * *"
  workflow_dispatch:
    inputs:
      force_build:
        description: "上游无更新时仍重新构建并发布"
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write

concurrency:
  group: zhihu-web-sync-ghcr
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/rogerma12345/zhihu_web

jobs:
  sync-and-publish:
    runs-on: ubuntu-24.04

    steps:
      - name: 检出分支
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: 合并上游改动
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "push" ]]; then
            upstream_sha="$(awk -F= '$1 == "upstream_sha" { print $2; exit }' .upstream-state)"
            [[ "$upstream_sha" =~ ^[0-9a-fA-F]{40}$ ]]
            echo "upstream_sha=${upstream_sha,,}" >> "$GITHUB_OUTPUT"
            echo "upstream_changed=false" >> "$GITHUB_OUTPUT"
          else
            ./deploy/sync-upstream.sh
          fi

      - name: 判断是否构建
        id: decision
        shell: bash
        run: |
          set -euo pipefail
          should_build=false
          if [[ "${{ github.event_name }}" == "push" ]]; then
            should_build=true
          elif [[ "${{ steps.prepare.outputs.upstream_changed }}" == "true" ]]; then
            should_build=true
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.force_build }}" == "true" ]]; then
            should_build=true
          fi
          echo "should_build=$should_build" >> "$GITHUB_OUTPUT"

      - name: 配置 Node.js
        if: steps.decision.outputs.should_build == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: 安装依赖并检查源码
        if: steps.decision.outputs.should_build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm test
          npm run build

      - name: 准备镜像信息
        id: image_vars
        if: steps.decision.outputs.should_build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          upstream_sha="${{ steps.prepare.outputs.upstream_sha }}"
          echo "upstream_short=${upstream_sha:0:12}" >> "$GITHUB_OUTPUT"
          echo "fork_short=${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          if [[ "${{ steps.prepare.outputs.upstream_changed }}" == "true" ]]; then
            echo "revision=$upstream_sha" >> "$GITHUB_OUTPUT"
          else
            echo "revision=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi

      - name: 配置 QEMU
        if: steps.decision.outputs.should_build == 'true'
        uses: docker/setup-qemu-action@v4

      - name: 配置 Docker Buildx
        if: steps.decision.outputs.should_build == 'true'
        uses: docker/setup-buildx-action@v4

      - name: 登录 GHCR
        if: steps.decision.outputs.should_build == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签
        id: meta
        if: steps.decision.outputs.should_build == 'true'
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=upstream-${{ steps.image_vars.outputs.upstream_short }},enable=${{ steps.prepare.outputs.upstream_changed == 'true' }}
            type=raw,value=fork-${{ steps.image_vars.outputs.fork_short }},enable=${{ steps.prepare.outputs.upstream_changed != 'true' }}
          labels: |
            org.opencontainers.image.source=https://github.com/Rogerma12345/zhihu_web
            org.opencontainers.image.revision=${{ steps.image_vars.outputs.revision }}
            org.opencontainers.image.created=${{ steps.image_vars.outputs.created }}
            io.zhihu-web.upstream=https://github.com/zhihulite/zhihu_web
            io.zhihu-web.upstream-revision=${{ steps.prepare.outputs.upstream_sha }}

      - name: 构建并发布镜像
        if: steps.decision.outputs.should_build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 提交同步结果
        if: success() && steps.prepare.outputs.upstream_changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- Dockerfile .dockerignore deploy SELFHOST.md .github/workflows \
            || ! git diff --cached --quiet -- Dockerfile .dockerignore deploy SELFHOST.md .github/workflows; then
            echo "部署文件发生了非预期修改" >&2
            git diff -- Dockerfile .dockerignore deploy SELFHOST.md .github/workflows >&2
            git diff --cached -- Dockerfile .dockerignore deploy SELFHOST.md .github/workflows >&2
            exit 1
          fi
          upstream_sha="${{ steps.prepare.outputs.upstream_sha }}"
          printf 'upstream_sha=%s\nlast_activity=%s\n' \
            "$upstream_sha" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .upstream-state
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "同步上游 ${upstream_sha:0:12}"
          git push origin HEAD:main
