name: Sync upstream and publish GHCR

on:
  schedule:
    - cron: "27 3 * * *"

  workflow_dispatch:
    inputs:
      force_build:
        description: "Build and publish even when upstream has not changed"
        required: false
        type: boolean
        default: false

  push:
    branches:
      - main

permissions:
  contents: write
  packages: write

concurrency:
  group: zhihu-web-sync-ghcr
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/rogerma12345/zhihu_web
jobs:
  sync-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Prepare upstream workspace
        id: prepare
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "push" ]]; then
            upstream_sha="$(awk -F= '$1 == "upstream_sha" { print $2; exit }' .upstream-state)"
            if [[ ! "$upstream_sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "Invalid upstream_sha in .upstream-state" >&2
              exit 1
            fi

            upstream_sha="${upstream_sha,,}"

            echo "upstream_sha=$upstream_sha" >> "$GITHUB_OUTPUT"
            echo "upstream_changed=false" >> "$GITHUB_OUTPUT"
          else
            bash ./deploy/sync-upstream.sh
          fi
      - name: Verify fork source
        shell: bash
        run: |
          set -euo pipefail
          python3 deploy/verify-project-fixes.py .

      - name: Check synchronized workspace
        if: steps.prepare.outputs.upstream_changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -f src/index.html
          test -f package.json
          test -f package-lock.json
          test -f vite.config.js
          test -f workbox-config.js
          test -f deploy/nginx.conf
          python3 deploy/verify-project-fixes.py .
          if ! git diff --quiet -- \
            Dockerfile \
            .dockerignore \
            deploy \
            SELFHOST.md \
            .github/workflows \
            .upstream-state
          then
            echo "Fork-managed files changed before publication" >&2
            git diff -- \
              Dockerfile \
              .dockerignore \
              deploy \
              SELFHOST.md \
              .github/workflows \
              .upstream-state >&2
            exit 1
          fi
      - name: Decide whether to build
        id: decision
        shell: bash
        run: |
          set -euo pipefail

          should_build=false

          if [[ "${{ github.event_name }}" == "push" ]]; then
            should_build=true

          elif [[ "${{ steps.prepare.outputs.upstream_changed }}" == "true" ]]; then
            should_build=true
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.force_build }}" == "true" ]]; then
            should_build=true
          fi

          echo "should_build=$should_build" >> "$GITHUB_OUTPUT"

      - name: Check keepalive threshold
        id: keepalive
        if: github.event_name == 'schedule' && steps.prepare.outputs.upstream_changed != 'true'
        shell: bash
        run: |
          set -euo pipefail
          upstream_sha="${{ steps.prepare.outputs.upstream_sha }}"

          last_activity="$(awk -F= '$1 == "last_activity" { print $2; exit }' .upstream-state)"

          if [[ -z "$last_activity" ]]; then
            echo "Missing last_activity in .upstream-state" >&2
            exit 1
          fi

          now_iso="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          now_epoch="$(date -u +%s)"
          last_epoch="$(date -u -d "$last_activity" +%s)" || {
            echo "Invalid last_activity in .upstream-state: $last_activity" >&2
            exit 1
          }

          if (( now_epoch - last_epoch >= 30 * 24 * 60 * 60 )); then
            printf 'upstream_sha=%s\nlast_activity=%s\n' \
              "$upstream_sha" \
              "$now_iso" > .upstream-state

            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit keepalive activity
        if: steps.keepalive.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .upstream-state
          git commit -m "chore: keep upstream sync active"
          git push origin HEAD:main
      - name: Prepare image metadata values
        id: image_vars
        if: steps.decision.outputs.should_build == 'true'
        shell: bash
        run: |
          set -euo pipefail

          upstream_sha="${{ steps.prepare.outputs.upstream_sha }}"
          echo "upstream_sha=$upstream_sha" >> "$GITHUB_OUTPUT"
          echo "upstream_short=${upstream_sha:0:12}" >> "$GITHUB_OUTPUT"
          echo "fork_short=${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          if [[ "${{ steps.prepare.outputs.upstream_changed }}" == "true" ]]; then
            echo "revision=$upstream_sha" >> "$GITHUB_OUTPUT"
          else
            echo "revision=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        if: steps.decision.outputs.should_build == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.decision.outputs.should_build == 'true'
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: steps.decision.outputs.should_build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags and labels
        id: meta
        if: steps.decision.outputs.should_build == 'true'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=upstream-${{ steps.image_vars.outputs.upstream_short }},enable=${{ steps.prepare.outputs.upstream_changed == 'true' }}
            type=raw,value=fork-${{ steps.image_vars.outputs.fork_short }},enable=${{ steps.prepare.outputs.upstream_changed != 'true' }}
          labels: |
            org.opencontainers.image.source=https://github.com/Rogerma12345/zhihu_web
            org.opencontainers.image.revision=${{ steps.image_vars.outputs.revision }}
            org.opencontainers.image.created=${{ steps.image_vars.outputs.created }}
            io.zhihu-web.upstream=https://github.com/zhihulite/zhihu_web
            io.zhihu-web.upstream-revision=${{ steps.image_vars.outputs.upstream_sha }}
      - name: Build and push multi-arch image
        if: steps.decision.outputs.should_build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile

          push: true

          platforms: |
            linux/amd64
            linux/arm64

          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record successful upstream publication
        if: success() && steps.prepare.outputs.upstream_changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          upstream_sha="${{ steps.prepare.outputs.upstream_sha }}"
          now_iso="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          printf 'upstream_sha=%s\nlast_activity=%s\n' \
            "$upstream_sha" \
            "$now_iso" > .upstream-state
          if ! git diff --quiet -- \
            Dockerfile \
            .dockerignore \
            deploy \
            SELFHOST.md \
            .github/workflows
          then
            echo "Refusing to commit automatic fork-managed changes" >&2
            git diff -- \
              Dockerfile \
              .dockerignore \
              deploy \
              SELFHOST.md \
              .github/workflows >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: sync upstream ${upstream_sha:0:12}"
          git push origin HEAD:main