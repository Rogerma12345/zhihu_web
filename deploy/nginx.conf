server {
    listen 0.0.0.0:80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        application/javascript
        application/json
        application/xml
        image/svg+xml
        text/css
        text/plain;

    location = / {
        return 302 /zhihu_web/;
    }

    location = /zhihu_web {
        return 301 /zhihu_web/;
    }

    location = /zhihu_web/ {
        add_header Cache-Control "no-cache" always;
    }

    location = /zhihu_web/index.html {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location = /zhihu_web/version.json {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location = /zhihu_web/service-worker.js {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location ~ "^/zhihu_web/assets/.*-[A-Za-z0-9_-]{8,}\.[^/]+$" {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /zhihu_web/assets/ {
        try_files $uri =404;
    }

    location /zhihu_web/ {
        try_files $uri $uri/ =404;
    }
}
